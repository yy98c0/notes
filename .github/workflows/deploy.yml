name: Deploy Quartz site to GitHub Pages

on:
  push:
    branches:
      - v5

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install TeX Live (TikZ → SVG)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-base \
            texlive-latex-extra \
            texlive-latex-recommended \
            texlive-pictures \
            texlive-fonts-recommended \
            texlive-science \
            texlive-plain-generic \
            dvisvgm \
            ghostscript
          if command -v fmtutil-sys >/dev/null 2>&1; then
            sudo fmtutil-sys --all >/dev/null 2>&1 || true
          fi
      - name: Install Dependencies
        run: npm ci
      - name: Install Quartz plugins
        run: npx quartz plugin install --from-config
      - name: Clear TikZ cache for reproducible CI builds
        run: rm -rf .quartz/tikz-cache
      - name: Build Quartz
        run: npx quartz build --concurrency=1
        env:
          TIKZ_DEBUG: "1"
      - name: Upload public/ on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: public-build-failed
          path: public/
          retention-days: 3
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: public

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
