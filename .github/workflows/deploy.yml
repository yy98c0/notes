name: Deploy Quartz site

on:
  push:
    branches:
      - v5

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install TeX Live (TikZ → SVG)
        uses: TeX-Live/setup-texlive-action@v4
        with:
          packages: |
            scheme-basic
            standalone
            pgf
            pgfplots
            tikz-cd
            chemfig
            simplekv
            xcolor
            dvisvgm
            preview
            currfile
            filehook
            gettitlestring
            tools
            iftex
      - name: Install Ghostscript
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ghostscript
      - name: Install Dependencies
        run: npm ci
      - name: Install Quartz plugins
        run: npx quartz plugin install --from-config
      - name: Default theme to dark (no localStorage yet)
        run: npm run patch-darkmode-default
      - name: Clear TikZ cache for reproducible CI builds
        run: rm -rf .quartz/tikz-cache
      - name: Build Quartz
        run: npx quartz build --concurrency=1
        env:
          TIKZ_DEBUG: "1"
      - name: Upload public/ on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: public-build-failed
          path: public/
          retention-days: 3
      - name: Upload site artifact
        uses: actions/upload-artifact@v7
        with:
          name: public
          path: public/
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: public

  deploy-pages:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  deploy-ecs:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download site artifact
        uses: actions/download-artifact@v8
        with:
          name: public
          path: public/
      - name: Setup SSH for rsync
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.ECS_SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H -p 2222 "${{ secrets.ECS_SSH_HOST }}" >> ~/.ssh/known_hosts
      - name: Deploy to ECS via rsync
        run: |
          rsync -avzr --delete \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes -p 2222" \
            public/ \
            "${{ secrets.ECS_SSH_USER }}@${{ secrets.ECS_SSH_HOST }}:${{ secrets.ECS_DEPLOY_PATH }}/"
      - name: Fix permissions on ECS
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes -p 2222 \
            "${{ secrets.ECS_SSH_USER }}@${{ secrets.ECS_SSH_HOST }}" \
            "chown -R www-data:www-data ${{ secrets.ECS_DEPLOY_PATH }} 2>/dev/null || chown -R nginx:nginx ${{ secrets.ECS_DEPLOY_PATH }} 2>/dev/null || true"
